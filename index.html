<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

:root {
  --bg: #070d1a;
  --panel: #0f1a2e;
  --border: #1a3a60;
  --accent: #00e5ff;
  --green: #39ff14;
  --orange: #ff6b35;
  --red: #ff3333;
  --gold: #ffd700;
  --muted: #3a5570;
  --btn-bg: #122030;
  --dpad-bg: #080f1c;
  --dpad-btn: #0f1e30;
  --dpad-border: #1a4060;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  background: var(--bg);
  color: #e0f2fe;
  font-family: 'Orbitron', sans-serif;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100dvh;
  background-image:
    radial-gradient(ellipse at 15% 15%, #002244 0%, transparent 55%),
    radial-gradient(ellipse at 85% 85%, #001133 0%, transparent 55%);
  overflow-y: auto;
  overflow-x: hidden;
}

#wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 480px;
  padding: 8px 10px 16px;
  gap: 8px;
}

/* HEADER */
#hdr {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 0 16px #00e5ff22;
  flex-shrink: 0;
}
#hdr .logo {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: var(--green);
  text-shadow: 0 0 10px var(--green);
}
.stat { font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
.stat span { color: #fff; }

/* ARENA */
#arena {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border: 2px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: #04090f;
  box-shadow: 0 0 28px #00e5ff18, inset 0 0 40px #00000088;
  flex-shrink: 0;
}
#gc {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: block;
}
#arena::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px, transparent 3px,
    rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 4px
  );
  pointer-events: none;
  z-index: 4;
}

/* SCREENS */
.scr {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px;
  background: rgba(4,9,15,0.95);
  z-index: 20; padding: 16px;
}
.scr.hide { display: none; }

.stitle {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(12px,3.5vw,20px);
  text-align: center; line-height: 1.7;
}
.stitle.g { color: var(--green);  text-shadow: 0 0 18px var(--green); }
.stitle.c { color: var(--accent); text-shadow: 0 0 18px var(--accent); }
.stitle.r { color: var(--red);    text-shadow: 0 0 18px var(--red); }

.slogo { display:flex; gap:5px; margin-bottom:2px; }
.slogo div {
  width:13px; height:13px; border-radius:3px;
  animation: pulseg 1.3s ease-in-out infinite;
}
.slogo div:nth-child(1){ background:#39ff14; animation-delay:0s; }
.slogo div:nth-child(2){ background:#2cdd10; animation-delay:.12s; }
.slogo div:nth-child(3){ background:#1fbb0c; animation-delay:.24s; }
.slogo div:nth-child(4){ background:#149908; animation-delay:.36s; }
.slogo div:nth-child(5){ background:#0a7705; border-radius:50%; animation-delay:.48s; }
@keyframes pulseg {
  0%,100%{ transform:scale(1); opacity:1; }
  50%{ transform:scale(1.3); opacity:.7; }
}

.mbtn {
  font-family: 'Orbitron', sans-serif;
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  padding: 11px 20px;
  border: 2px solid var(--accent); border-radius: 6px;
  background: var(--btn-bg); color: var(--accent);
  cursor: pointer; width: 100%; max-width: 220px;
  text-align: center; transition: all .12s;
}
.mbtn:active { transform:scale(.97); box-shadow:0 0 14px var(--accent); background:#00e5ff18; }
.mbtn.g { border-color:var(--green); color:var(--green); }
.mbtn.g:active { box-shadow:0 0 14px var(--green); background:#39ff1418; }

.sopts { display:flex; flex-direction:column; gap:8px; width:100%; max-width:220px; }
.sopt {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px;
  border:2px solid var(--border); border-radius:6px;
  background:var(--btn-bg);
  cursor:pointer; font-size:11px; font-weight:700; letter-spacing:1px;
  transition:all .12s;
}
.sopt.sel { border-color:var(--green); box-shadow:0 0 10px #39ff1466; background:#39ff1412; }
.sopt:active { transform:scale(.97); }
.sradio { width:13px; height:13px; border-radius:50%; border:2px solid var(--muted); flex-shrink:0; }
.sopt.sel .sradio { border-color:var(--green); background:var(--green); box-shadow:0 0 6px var(--green); }

.hslist { display:flex; flex-direction:column; gap:5px; width:100%; max-width:240px; }
.hsrow {
  display:flex; align-items:center;
  padding:7px 10px;
  background:var(--btn-bg); border:1px solid var(--border);
  border-radius:4px; font-size:9px;
}
.hsrow.top { border-color:var(--gold); background:#1a1300; color:var(--gold); font-size:10px; }
.hsrk { color:var(--muted); width:18px; flex-shrink:0; }
.hsnm { flex:1; margin-left:6px; }
.hspd { font-size:8px; color:var(--muted); margin-right:6px; }
.hssc { color:var(--accent); font-weight:700; }
.hsrow.top .hssc { color:var(--gold); }

.goscore { font-family:'Press Start 2P', monospace; font-size:30px; color:#fff; text-shadow:0 0 18px #ffffff99; }
.golbl  { font-size:9px; color:var(--muted); letter-spacing:3px; }
.gonew  { font-size:9px; color:var(--gold); letter-spacing:2px; }

#pbadge {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  font-family:'Press Start 2P', monospace;
  font-size:16px; color:var(--accent);
  text-shadow:0 0 16px var(--accent);
  background:rgba(4,9,15,.9);
  padding:14px 24px; border-radius:8px; border:2px solid var(--accent);
  display:none; z-index:10;
  animation:bpause 1s ease-in-out infinite;
}
#pbadge.show { display:block; }
@keyframes bpause { 0%,100%{opacity:1} 50%{opacity:.3} }

/* D-PAD */
#dpad-wrap {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding-top: 4px;
  flex-shrink: 0;
}

#dpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  width: min(240px, 65vw);
  height: min(240px, 65vw);
  gap: 5px;
  background: var(--dpad-bg);
  padding: 10px;
  border-radius: 18px;
  border: 2px solid var(--dpad-border);
  box-shadow: 0 0 24px #00e5ff14, inset 0 2px 6px #00000066;
}

.db {
  border-radius: 10px;
  border: 2px solid var(--dpad-border);
  background: var(--dpad-btn);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: clamp(18px,5.5vw,28px);
  box-shadow: 0 5px 0 #00000077, inset 0 1px 0 #ffffff10;
  transition: background .08s, box-shadow .08s, transform .08s;
}
.db:active, .db.pr {
  background: #00e5ff1a;
  box-shadow: 0 0 16px var(--accent), 0 2px 0 #00000077;
  transform: translateY(3px);
}
.db.empty { visibility: hidden; pointer-events: none; }

#dpad-sel {
  border-radius: 50%;
  border-color: #ff6b3555;
  color: var(--orange);
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(6px,1.8vw,9px);
  font-weight: 900;
  line-height: 1.3;
  text-align: center;
  padding: 0 2px;
}
#dpad-sel:active, #dpad-sel.pr {
  box-shadow: 0 0 16px var(--orange), 0 2px 0 #00000077;
  background: #ff6b3512;
}
</style>
</head>
<body>
<div id="wrap">

  <div id="hdr">
    <div class="logo">🐍 SNAKE</div>
    <div class="stat">SCORE <span id="sv">0</span></div>
    <div class="stat">SPD <span id="spv">MED</span></div>
  </div>

  <div id="arena">
    <canvas id="gc"></canvas>
    <div id="pbadge">PAUSED</div>

    <div id="s-home" class="scr">
      <div class="slogo">
        <div></div><div></div><div></div><div></div><div></div>
      </div>
      <div class="stitle g">SNAKE<br>RUNNER</div>
      <div style="font-size:8px;color:var(--muted);letter-spacing:2px;margin-top:-4px">v1.0 · JIO EDITION</div>
      <button class="mbtn g" onclick="startGame()">▶ NEW GAME</button>
      <button class="mbtn"   onclick="show('s-speed')">⚡ SPEED LEVEL</button>
      <button class="mbtn"   onclick="showHS()">🏆 HIGH SCORE</button>
    </div>

    <div id="s-speed" class="scr hide">
      <div class="stitle c">SPEED LEVEL</div>
      <div class="sopts">
        <div class="sopt" data-s="slow"   onclick="pickSpeed('slow')"><div class="sradio"></div>🐢 SLOW</div>
        <div class="sopt" data-s="medium" onclick="pickSpeed('medium')"><div class="sradio"></div>🐍 MEDIUM</div>
        <div class="sopt" data-s="fast"   onclick="pickSpeed('fast')"><div class="sradio"></div>⚡ FAST</div>
      </div>
      <button class="mbtn" onclick="show('s-home')">← BACK</button>
    </div>

    <div id="s-hs" class="scr hide">
      <div class="stitle c">HIGH SCORES</div>
      <div class="hslist" id="hslist"></div>
      <button class="mbtn" onclick="show('s-home')">← BACK</button>
    </div>

    <div id="s-go" class="scr hide">
      <div class="stitle r">GAME OVER</div>
      <div class="golbl">FINAL SCORE</div>

      <div class="gonew hide" id="gonew">🏆 NEW BEST!</div>
      <button class="mbtn g" onclick="startGame()">↺ RESTART</button>
      <button class="mbtn"   onclick="show('s-home')">⌂ HOME</button>
    </div>
  </div>

  <div id="dpad-wrap">
    <div id="dpad">
      <div class="db empty"></div>
      <div class="db" id="db-up"    data-dir="up">▲</div>
      <div class="db empty"></div>
      <div class="db" id="db-left"  data-dir="left">◀</div>
      <div class="db" id="dpad-sel" onclick="togglePause()">PAUSE<br>SEL</div>
      <div class="db" id="db-right" data-dir="right">▶</div>
      <div class="db empty"></div>
      <div class="db" id="db-down"  data-dir="down">▼</div>
      <div class="db empty"></div>
    </div>
  </div>

</div>

<script>
const COLS=20,ROWS=20;
const SPEEDS={slow:230,medium:140,fast:70};
const SLBLS={slow:'SLW',medium:'MED',fast:'FST'};
const OPP={up:'down',down:'up',left:'right',right:'left'};

const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');
let CELL=20;

function syncCanvas(){
  const sz=document.getElementById('arena').clientWidth;
  canvas.width=sz; canvas.height=sz; CELL=sz/COLS;
}
syncCanvas();
window.addEventListener('resize',()=>{ syncCanvas(); if(!running) drawBg(); else render(); });

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.beginPath();
    this.moveTo(x+r,y); this.lineTo(x+w-r,y);
    this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r);
    this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r);
    this.quadraticCurveTo(x,y,x+r,y);
    this.closePath(); return this;
  };
}

let snake,dir,qdir,food,score,running,paused,raf,last,acc;
let speed='medium';
let hs=[];
try{hs=JSON.parse(localStorage.getItem('snakeHS3')||'[]');}catch(e){}

function show(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.add('hide'));
  if(id) document.getElementById(id).classList.remove('hide');
}

function pickSpeed(s){
  speed=s;
  document.querySelectorAll('.sopt').forEach(el=>el.classList.toggle('sel',el.dataset.s===s));
  document.getElementById('spv').textContent=SLBLS[s];
}
pickSpeed('medium');

function showHS(){
  const list=document.getElementById('hslist');
  const sorted=[...hs].sort((a,b)=>b.sc-a.sc).slice(0,8);
  list.innerHTML=sorted.length===0
    ?'<div style="font-size:9px;color:var(--muted);padding:12px 0;text-align:center">No scores yet!</div>'
    :sorted.map((e,i)=>`<div class="hsrow${i===0?' top':''}">
        <span class="hsrk">#${i+1}</span>
        <span class="hsnm">YOU</span>
        <span class="hspd">${e.spd||'MED'}</span>
        <span class="hssc">${e.sc}</span>
      </div>`).join('');
  show('s-hs');
}

function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,'#06101e'); g.addColorStop(1,'#030810');
  ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='rgba(0,180,220,0.07)'; ctx.lineWidth=0.5;
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();}
  for(let j=0;j<=ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*CELL);ctx.lineTo(canvas.width,j*CELL);ctx.stroke();}
}

function drawHead(x,y,d){
  const px=x*CELL,py=y*CELL,cx=px+CELL/2,cy=py+CELL/2,r=CELL*.44;
  ctx.save(); ctx.shadowColor='#39ff14'; ctx.shadowBlur=14;
  const hg=ctx.createRadialGradient(cx-CELL*.1,cy-CELL*.1,0,cx,cy,r*1.3);
  hg.addColorStop(0,'#88ff55'); hg.addColorStop(.5,'#2de010'); hg.addColorStop(1,'#0a5505');
  ctx.fillStyle=hg;
  ctx.roundRect(px+1,py+1,CELL-2,CELL-2,Math.max(3,CELL*.18)); ctx.fill(); ctx.restore();
  const er=Math.max(1.5,CELL*.1),off=r*.38;
  let e1x,e1y,e2x,e2y;
  if(d==='right'){e1x=cx+off;e1y=cy-off;e2x=cx+off;e2y=cy+off;}
  else if(d==='left'){e1x=cx-off;e1y=cy-off;e2x=cx-off;e2y=cy+off;}
  else if(d==='up'){e1x=cx-off;e1y=cy-off;e2x=cx+off;e2y=cy-off;}
  else{e1x=cx-off;e1y=cy+off;e2x=cx+off;e2y=cy+off;}
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(e1x,e1y,er,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(e2x,e2y,er,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(e1x+er*.25,e1y+er*.25,er*.55,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(e2x+er*.25,e2y+er*.25,er*.55,0,Math.PI*2);ctx.fill();
  const tl=CELL*.3,lw=Math.max(1,CELL*.08);
  let tx=cx,ty=cy,ta=0;
  if(d==='right'){tx=cx+r;ta=0;}else if(d==='left'){tx=cx-r;ta=Math.PI;}
  else if(d==='up'){ty=cy-r;ta=-Math.PI/2;}else{ty=cy+r;ta=Math.PI/2;}
  ctx.save(); ctx.translate(tx,ty); ctx.rotate(ta);
  ctx.strokeStyle='#ff1144'; ctx.lineWidth=lw;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(tl,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(tl,0);ctx.lineTo(tl+CELL*.18,-CELL*.16);ctx.stroke();
  ctx.beginPath();ctx.moveTo(tl,0);ctx.lineTo(tl+CELL*.18,CELL*.16);ctx.stroke();
  ctx.restore();
}

function drawBody(seg,idx,total){
  const px=seg.x*CELL,py=seg.y*CELL,cx=px+CELL/2,cy=py+CELL/2;
  const gv=Math.round(215-(idx/total)*130);
  ctx.save(); ctx.shadowColor='rgba(57,255,20,0.22)'; ctx.shadowBlur=5;
  if(idx%2===0){
    const s=CELL*.44;
    ctx.fillStyle=`rgb(${Math.round(22+gv*.18)},${gv},8)`;
    ctx.strokeStyle='rgba(57,255,20,0.2)'; ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s,cy);ctx.lineTo(cx,cy+s);ctx.lineTo(cx-s,cy);ctx.closePath();
    ctx.fill();ctx.stroke();
  } else {
    const pad=Math.max(1,CELL*.1);
    ctx.fillStyle=`rgb(${Math.round(15+gv*.12)},${Math.round(gv*.8)},6)`;
    ctx.strokeStyle='rgba(57,255,20,0.12)'; ctx.lineWidth=1;
    ctx.roundRect(px+pad,py+pad,CELL-pad*2,CELL-pad*2,Math.max(2,CELL*.14));
    ctx.fill();ctx.stroke();
  }
  ctx.restore();
}

function drawFood(){
  const cx=food.x*CELL+CELL/2,cy=food.y*CELL+CELL/2;
  const r=Math.max(4,CELL*.38),t=Date.now()/600,p=1+Math.sin(t)*.09;
  ctx.save(); ctx.shadowColor='#ff3333'; ctx.shadowBlur=14+Math.sin(t)*5;
  ctx.translate(cx,cy); ctx.scale(p,p); ctx.translate(-cx,-cy);
  const ag=ctx.createRadialGradient(cx-r*.2,cy-r*.2,0,cx,cy,r);
  ag.addColorStop(0,'#ff8080');ag.addColorStop(.45,'#e81010');ag.addColorStop(1,'#7a0000');
  ctx.fillStyle=ag; ctx.beginPath();ctx.arc(cx,cy+r*.05,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.beginPath();ctx.ellipse(cx-r*.22,cy-r*.22,r*.28,r*.17,-Math.PI/4,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.strokeStyle='#3a1f00';ctx.lineWidth=Math.max(1.5,CELL*.09);
  ctx.beginPath();ctx.moveTo(cx,cy-r*p);ctx.quadraticCurveTo(cx+r*.45,cy-r*1.45,cx+r*.1,cy-r*1.55);ctx.stroke();
  ctx.fillStyle='#1e8800';
  ctx.beginPath();ctx.ellipse(cx+r*.28,cy-r*1.22,r*.28,r*.14,-Math.PI/3.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function render(){
  drawBg();
  for(let i=snake.length-1;i>0;i--) drawBody(snake[i],snake.length-i,snake.length);
  drawHead(snake[0].x,snake[0].y,dir);
  drawFood();
}

function spawnFood(){
  let fx,fy,tries=0;
  do{fx=(Math.random()*COLS)|0;fy=(Math.random()*ROWS)|0;}
  while(snake.some(s=>s.x===fx&&s.y===fy)&&++tries<400);
  food={x:fx,y:fy};
}

function startGame(){
  syncCanvas(); show(null);
  document.getElementById('pbadge').classList.remove('show');
  snake=[{x:12,y:10},{x:11,y:10},{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir=qdir='right'; score=0; running=true; paused=false;
  document.getElementById('sv').textContent=0;
  document.getElementById('spv').textContent=SLBLS[speed];
  spawnFood();
  if(raf) cancelAnimationFrame(raf);
  last=0;acc=0;
  raf=requestAnimationFrame(loop);
}

function loop(ts){
  if(!running) return;
  const dt=last?ts-last:0; last=ts;
  if(!paused){
    acc+=dt; const iv=SPEEDS[speed];
    while(acc>=iv){acc-=iv;tick();if(!running)return;}
    render();
  }
  raf=requestAnimationFrame(loop);
}

function tick(){
  dir=qdir; const h=snake[0];
  let nx=h.x,ny=h.y;
  if(dir==='up')ny--;if(dir==='down')ny++;if(dir==='left')nx--;if(dir==='right')nx++;
  if(nx<0||nx>=COLS||ny<0||ny>=ROWS){endGame();return;}
  if(snake.some(s=>s.x===nx&&s.y===ny)){endGame();return;}
  snake.unshift({x:nx,y:ny});
  if(nx===food.x&&ny===food.y){score+=10;document.getElementById('sv').textContent=score;spawnFood();}
  else snake.pop();
}

function endGame(){
  running=false; cancelAnimationFrame(raf);
  hs.push({sc:score,spd:SLBLS[speed]});
  hs.sort((a,b)=>b.sc-a.sc); if(hs.length>10)hs.length=10;
  try{localStorage.setItem('snakeHS3',JSON.stringify(hs));}catch(e){}
  document.getElementById('goscr').textContent=score;
  const nb=document.getElementById('gonew');
  hs[0].sc===score?nb.classList.remove('hide'):nb.classList.add('hide');
  show('s-go');
}

function togglePause(){
  if(!running)return; paused=!paused;
  const b=document.getElementById('pbadge');
  paused?b.classList.add('show'):(b.classList.remove('show'),last=0);
}

function setDir(d){
  if(!running||paused)return;
  if(d===OPP[dir])return;
  qdir=d;
  const ids={up:'db-up',down:'db-down',left:'db-left',right:'db-right'};
  const el=document.getElementById(ids[d]);
  if(el){el.classList.add('pr');setTimeout(()=>el.classList.remove('pr'),140);}
}

document.querySelectorAll('.db[data-dir]').forEach(btn=>{
  btn.addEventListener('pointerdown',e=>{e.preventDefault();setDir(btn.dataset.dir);},{passive:false});
});

document.addEventListener('keydown',e=>{
  const km={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
  if(km[e.key]){e.preventDefault();setDir(km[e.key]);return;}
  if(e.key===' '||e.key==='p'||e.key==='P'||e.key==='Enter'){e.preventDefault();togglePause();}
});

drawBg();
</script>
</body>
</html>
